<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦宠物动画预览</title>
<style>
  :root{ --mcd-red:#C8102E; --mcd-yellow:#FFD23F; --ink:#222; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
        background:#f4f5f7; color:var(--ink); padding:24px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:#666; font-size:13px; margin:0 0 20px; }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px; max-width:920px; }
  .card{ background:var(--card); border:1px solid #e6e8eb; border-radius:16px;
         padding:14px 14px 16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .card h2{ font-size:15px; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  .tag{ font-size:11px; background:#fff3f5; color:var(--mcd-red);
        border:1px solid #ffd7df; border-radius:999px; padding:1px 8px; }
  .desc{ font-size:12px; color:#777; margin:0 0 10px; min-height:32px; }
  .stage{ height:230px; position:relative; display:flex; align-items:flex-end;
          justify-content:center; background:linear-gradient(180deg,#fafbfc,#eef1f4);
          border-radius:12px; overflow:hidden; }
  .row{ display:flex; align-items:flex-end; justify-content:center; gap:6px; position:relative; z-index:2; }
  .mascot{ width:120px; height:auto; display:block; }
  .clone{ width:62px; height:auto; display:block; }
  .note{ position:absolute; color:var(--mcd-red); font-size:20px; opacity:0; z-index:3; }
  .heart{ position:absolute; color:var(--mcd-red); font-size:18px; opacity:0; z-index:3; }
  .particle{ position:absolute; top:-40px; width:30px; height:auto; z-index:1; }
  .btn{ margin-top:10px; border:none; background:var(--mcd-red); color:#fff;
        font-size:13px; padding:7px 14px; border-radius:8px; cursor:pointer; }
  .btn:hover{ background:#a50d24; }
  /* 1 分身合奏 */
  .playing.c1 .main{ animation:bob 1.1s ease-in-out infinite; }
  .playing.c1 .clone{ animation:sway 1.1s ease-in-out infinite; }
  .playing.c1 .clone.r{ animation-delay:.15s; }
  .playing.c1 .note{ animation:floatNote 1.6s ease-in-out infinite; }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-7deg)}}
  @keyframes floatNote{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
  /* 2 叠叠乐长高 */
  .stack{ position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex;
          flex-direction:column-reverse; align-items:center; z-index:1; }
  .stack img{ width:96px; height:auto; margin-top:-30px; }
  .playing.c2 .main{ animation:grow 1.3s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes grow{0%,100%{transform:scaleY(1) rotate(0)}50%{transform:scaleY(1.12) rotate(-3deg)}}
  /* 3 撒薯条庆祝 */
  .playing.c3 .main{ animation:jump 0.9s ease-in-out infinite; }
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px)}}
  /* 4 原地蹦跳转圈 */
  .playing.c4 .main{ animation:hopSpin 1.4s ease-in-out infinite; }
  @keyframes hopSpin{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34px) rotate(0)}
                     65%{transform:translateY(0) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  .playing.c4 .heart{ animation:floatHeart 1.4s ease-in-out infinite; }
  @keyframes floatHeart{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
</style>
</head>

  document.querySelectorAll('img').forEach(i=>{ if(!i.src || false) i.src = DATA; });
  // 粒子（方案3）
  const stages = document.querySelectorAll('.stage');
  function spawnParticles(stage){
    const p = document.createElement('img');
    p.className='particle'; p.src=DATA;
    p.style.left = (10+Math.random()*70)+'%';
    const dur = 1.2+Math.random()*0.8;
    p.style.animation = `fall ${dur}s linear forwards`;
    stage.appendChild(p);
    setTimeout(()=>p.remove(), dur*1000);
  }
  const style = document.createElement('style');
  style.textContent = '@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(260px) rotate(360deg);opacity:0}}';
  document.head.appendChild(style);
  let pInt=null;
  function stopParticles(){ if(pInt){clearInterval(pInt);pInt=null;} }
  function startParticles(){ stopParticles(); pInt=setInterval(()=>{
    const s=document.querySelector('.stage.c3'); if(s.classList.contains('playing')) spawnParticles(s);
  },260); }
  startParticles();
  // 重播
  document.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const n=b.dataset.replay;
      const s=document.querySelector('.stage.c'+n);
      s.classList.remove('playing'); void s.offsetWidth; s.classList.add('playing');
      if(n==='3') startParticles();
    });
  });
</script>
